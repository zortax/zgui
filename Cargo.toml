[workspace]
resolver = "3"
members = ["crates/*", "spikes/*", "xtask"]
exclude = ["xtask/fixtures", "vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Every dependency of every crate is declared here and inherited with `foo.workspace = true`,
# so a version, a feature set or a `default-features` decision exists in exactly one place.
# `cargo xtask ledger versions` enforces both halves of that rule.
[workspace.dependencies]

# --- style engine: named only by zgui-css, zgui-dom, zgui-style ---------------------------
stylo = "=0.19.0"
stylo_dom = "=0.19.0"
stylo_atoms = "=0.19.0"
stylo_static_prefs = "=0.19.0"
selectors = "0.39.0"
servo_arc = "0.4.3"
web_atoms = "0.2.5"
cssparser = "0.37.0"
app_units = "0.7.8"
# `TElement::query_container_size` returns `euclid::default::Size2D<Option<Au>>` in return
# position, so whichever crate implements the style engine's DOM traits has to name euclid.
euclid = "0.22.14"

# --- layout: named only by zgui-layout ----------------------------------------------------
# The feature set is pinned explicitly and `default-features` is off: we own the tree, so
# `taffy_tree` is unwanted, while losing `content_size` would silently zero every intrinsic
# size and losing `float_layout` would silently delete floats. `std` is not optional in
# practice: taffy 0.12.2's `detailed_layout_info` names `Box` through the std prelude, so the
# crate does not compile without it.
#
# The vendored copy is named by path rather than through `[patch.crates-io]`, because a patch
# section only takes effect in the root manifest of whatever workspace is building: a project
# depending on zgui by path would compile zgui-layout against the unpatched release — which,
# now that the local changes extend a trait zgui-layout implements, does not compile at all,
# and before that silently dropped the layout fixes. See vendor/README.md for the changes.
taffy = { path = "vendor/taffy", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }

# --- text: named only by zgui-text-parley --------------------------------------------------
parley = "0.11.0"
fontique = "0.11.0"
harfrust = "0.10.0"
skrifa = "0.43.2"
swash = "0.2.10"
zeno = "0.3.3"

# --- gpu and vector ------------------------------------------------------------------------
# wgpu is pinned to 29.x workspace-wide because vello 0.9 links wgpu 29.0.4 and shares one
# device, queue and target texture with the renderer.
wgpu = "29.0.4"
vello = "0.9.0"
# wgpu's own shader front end, named here so that its `serialize` and `deserialize` features can be
# turned on and the WGSL can be parsed at build time instead of on every launch. It is the same
# version wgpu links, and it has to stay that way: the representation crosses between them.
naga = "29.0.4"
# Encoding that representation, and nothing else. A shader's intermediate form is written by a
# build script and read by the program it was built for, so the two ends are always the same build.
bincode = "1.3"
# Vulkan itself, named only by `zgui-platform-drm`. A buffer a display controller scans out of is a
# Vulkan image created with a DRM format modifier, backed by exportable memory and handed to the
# kernel as a dma-buf. wgpu's API describes none of those three, so the image is built in Vulkan's
# own types and reaches wgpu through its hal at the end.
#
# The version is the one wgpu-hal links and it has to stay that way. wgpu-hal does not re-export
# `ash`, so `vk::Image` crosses between two crates that each name the dependency for themselves,
# and two copies of ash in the graph are two unrelated types under one spelling: `texture_from_raw`
# would refuse the image. wgpu-hal 29.0.4 asks for `ash = "0.38"`, `Cargo.lock` resolves that to
# 0.38.0+1.3.281, and the versions ledger holds the graph to one copy.
ash = "0.38"

# --- platform, clipboards and accessibility --------------------------------------------------
# `winit`, `accesskit_winit`, `arboard`, `smithay-clipboard` and `zbus` are the windowing
# backend's: `zgui-platform-winit` is the only crate that ships one of them, and `probe`, the
# canary that compiles the pinned versions together, links winit and the winit adapter beside it.
winit = "0.30.13"
# The accessibility tree, which belongs to no one backend: nine crates may name it and eight do,
# from the vocabulary a node is described in up to each backend of the platform contract.
accesskit = "0.24.1"
accesskit_winit = "0.33.2"
# Reading a published tree back, named by `zgui-runtime` and `zgui-ui`.
accesskit_consumer = "0.38.0"

# --- platform: named only by zgui-platform-wayland ------------------------------------------
# The compositor spoken to directly, on the one desktop where going through a portable windowing
# library costs correctness rather than only control: frame pacing, real occlusion, layer surfaces
# and pop-ups are each unreachable or wrong through winit there. See `docs/guide/architecture.md`.
#
# The toolkit is the part of a Wayland client that is the same in every Wayland client — the
# registry, the seat, the keymap, the shells, the data devices — and writing it again would be
# several thousand lines of protocol plumbing with the same shape and worse coverage. Its defaults
# are both wanted: `calloop` is the loop this backend runs on, and `xkbcommon` is the keymap, which
# is why it is not `default-features = false`. That feature links libxkbcommon at build time
# through pkg-config, which is a build dependency this crate's targets already all have.
smithay-client-toolkit = "0.20.0"
# The protocol itself, for the parts the toolkit does not wrap: fractional scale, the viewport it
# is applied through, and the text input.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = [
    "client",
    "staging",
    "unstable",
] }
# `client_system` is not optional here and not a preference: it routes through libwayland, and the
# graphics API's own window-system integration takes the same `wl_display` this connection holds.
# The pure-Rust backend would hand it a pointer into a different implementation of the protocol.
wayland-backend = { version = "0.3.16", features = ["client_system"] }
# The loop every source is registered on, and the adapter that owns the read/dispatch/flush cycle
# for the Wayland socket. Getting that cycle wrong by hand is a client that sleeps holding unread
# events, which is a freeze.
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
# The compositor's own extensions, for the layer shell and — under test — for the virtual input
# device that gives a headless session something to move.
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# rustix is named here too, for the monotonic clock the compositor stamps its presentation feedback
# in. One workspace entry serves both backends; it is below, with the kernel's interfaces.

# The accessibility adapter for this desktop. `accesskit_winit` wraps the same one; this backend
# has no winit to wrap it with.
accesskit_unix = "0.22.1"
# `default-features = false` drops `wayland-data-control`, so the X11 arm is taken
# unconditionally and the Wayland clipboard goes through smithay-clipboard instead.
arboard = { version = "3.6", default-features = false }
smithay-clipboard = "0.7"
zbus = "5.18"
# The native handles a surface hands a graphics API, named by the platform contract and by both
# backends that implement it.
raw-window-handle = "0.6.2"

# --- reactivity: named only by zgui-reactive ------------------------------------------------
# Without `effects` the whole UI compiles, runs and silently never updates.
reactive_graph = { version = "=0.2.14", features = ["effects"] }
reactive_stores = "=0.4.3"
any_spawner = "=0.3.0"
send_wrapper = "0.6"
# `thread-pool` is the default background executor an application gets without choosing one.
# `research/reactive.md` §3.1 rejected this feature because it made `Executor::spawn` lazily start
# an OS pool behind the framework's back; that objection is gone, because `UiExecutor` overrides
# both of `any_spawner`'s spawn paths and nothing reaches `futures`' own. The pool is now something
# asked for by name, from one place, and started on first use.
futures = { version = "0.3", features = ["thread-pool"] }

# --- the tokio backend: named only by zgui-tokio ---------------------------------------------
# `default-features = false` because this crate wants a runtime and its synchronisation, and none
# of the process, signal or io-std machinery a default tokio brings. `rt-multi-thread` makes
# background work actually concurrent; `time` and `net` are why an application installs this in the
# first place, and leaving them out would make `tokio::time::sleep` panic at runtime inside a
# framework that had just promised it worked.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
] }

# --- pure-data geometry, colour and GPU plumbing --------------------------------------------
kurbo = "0.13.1"
peniko = "0.6.1"
# --- vector documents: named only by zgui-svg -------------------------------------------------
# A parser and nothing else: it resolves an SVG document into a tree of paths, paints and clips
# and draws nothing itself, so it sits under a rendering model of our own that two different
# rasterisers implement. `default-features = false` drops the `text` feature, and with it fontdb,
# rustybuzz and a second font stack alongside the one this framework already has.
usvg = { version = "0.46.0", default-features = false }
etagere = "0.3"
bytemuck = { version = "1.25", features = ["derive"] }

# --- raster image codecs: named only by zgui-image --------------------------------------------
# `default-features = false` because the default set links every codec the crate knows, rayon and
# all; the four here cover what `image(src=...)` promises to show. GIF decodes to its first frame —
# animation is a scheduling question, and it does not belong in this crate.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }

# --- proc macros: named only by zgui-view-macro ----------------------------------------------
syn = { version = "2.0", features = ["full", "extra-traits", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"

# --- general utilities -----------------------------------------------------------------------
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = "0.3"
bitflags = "2.13"
rustc-hash = "2.1"
smallvec = "1.15"
rayon = "1.12"
toml = "1.1"

# --- the kernel's interfaces: named by zgui-drm, zgui-evdev, zgui-platform-drm -----------------
# `default-features = false` states the feature list in full. `std` is the only default and it is
# back in the list below; what stays off is `use-libc`, so rustix takes its `linux_raw` backend on
# Linux and a call reaches the kernel without passing through libc.
#
# `fs` opens a device node, reads back the flags it was opened with, and watches `/dev/input`
# through inotify for a node that arrives later. `mm` maps a dumb buffer. `event` covers the
# eventfd a wake channel is and the `poll` a frame loop parks in. `time` reads `CLOCK_MONOTONIC`,
# to anchor the clock an input report is stamped against to the frame loop's own origin; without
# it the two share no zero.
#
# `zgui-platform-wayland` reads that same clock, for the timeline its presentation feedback is
# stamped in. A workspace entry is one entry, so this list is the union and every member takes all
# of it.
rustix = { version = "1.1", default-features = false, features = [
    "std",
    "fs",
    "mm",
    "event",
    "time",
] }
# Reads the vendored uapi headers at build time, for `zgui-drm` and `zgui-evdev`. The alternative
# is transcribing every struct by hand, where one field of the wrong width silently changes an
# ioctl request number — the number is computed from `size_of` — and the kernel then refuses the
# call with an errno that points at nothing.
bindgen = "0.72"

# --- libraries opened at run time: named only by zgui-xkb, zgui-seat, zgui-libinput -------------
# `dlopen` and `dlsym`, wrapped so that a shared object cannot outlive the symbols taken out of
# it. Three libraries are reached this way, one crate each: libxkbcommon, libseat and libinput.
# Each is loaded at run time and never linked, so a build needs neither the library nor the data
# files it reads, and a console session still starts on a machine that has none of them. There is
# no feature set to state — the crate has none.
libloading = "0.8"

# --- test and benchmark tooling ----------------------------------------------------------------
proptest = "1.11"
criterion = "0.8"
insta = "1.48"
trybuild = "1.0"
loom = "0.7"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
