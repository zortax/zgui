[package]
name = "zgui-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "shadcn-style component library for zgui"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# L8 — product. Every dependency is inherited: `foo.workspace = true`.
#
# Three edges, and every one of them is a crate an application depends on too: the umbrella, the
# headless behaviours, the design tokens and the icons. Nothing here reaches past the public API,
# because anything these components need, an application author needs as well — so a fourth edge,
# into the framework's own crates, would be a hole in that API rather than a convenience.
[dependencies]
zgui = { path = "../zgui", version = "0.1.0" }
zgui-ui-icons = { path = "../zgui-ui-icons", version = "0.1.0" }
zgui-ui-primitives = { path = "../zgui-ui-primitives", version = "0.1.0" }
zgui-ui-tokens = { path = "../zgui-ui-tokens", version = "0.1.0" }

[features]
# What the console examples need. The component library itself asks the framework for nothing
# platform-specific, and the console is a crate of its own here rather than a feature of the
# framework — so this feature names no dependency. It exists to keep two examples that need a
# kernel display out of an ordinary `cargo build --examples`.
drm = []

[dev-dependencies]
# Only for the console examples: the console takes the display over, so a message written to
# standard error lands on pixels the frame loop is about to overwrite, and a log has to reach a
# file before anything can be read at all.
tracing.workspace = true
tracing-subscriber.workspace = true
# Encoding the fixture pictures the scrolled-images fixture feeds through the real loader; the
# framework decodes them back through `zgui-image`, which is the path under test.
image.workspace = true
zgui-testkit-view = { path = "../zgui-testkit-view", version = "0.1.0" }
# `run_drm`, for the two console examples. Linux-gated because a bare console is: the crate's own
# dependencies are gated the same way.
# Reading the computed tree back out of a live window, for fixtures that ask where a page's
# scrollable size actually came from rather than only what it is.
zgui-layout = { path = "../zgui-layout", version = "0.1.0" }
# Driving the same components over buffers, with the real router, the real hit test and the real
# activation defaults under them. Dispatching an event straight at a node answers what a component
# does *given* a click; only this answers whether a pointer press and release ever becomes one.
zgui-platform-headless = { path = "../zgui-platform-headless", version = "0.1.0" }
# A graphics device, and what rasterises the vector parts of a display list on it. Everything else
# written about a drawing in this package stops at the display list, and a display list is satisfied
# by a rasteriser that writes nothing — so the gallery's pixels are read back off a real device,
# through the same two crates a window is drawn through.
zgui-render-wgpu = { path = "../zgui-render-wgpu", version = "0.1.0" }
zgui-render-vector-vello = { path = "../zgui-render-vector-vello", version = "0.1.0" }
# The map the ink measurement tallies colours in.
rustc-hash.workspace = true
# The accessibility tree, read by the consumer a screen reader's platform adapter is built on.
# Asserting on the tree this library *publishes* is asserting on our own structure; this applies
# the updates the way a real client does and asks the result the questions a reader asks.
accesskit_consumer.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
zgui-console = { path = "../zgui-console", version = "0.1.0" }

# The two scenes that run on the kernel's display rather than on a desktop. Declared rather than
# discovered, so that `required-features` can keep them out of a build that has no console.
[[example]]
name = "gallery_tty"
path = "examples/gallery_tty.rs"
required-features = ["drm"]

[[example]]
name = "tty_scrim"
path = "examples/tty_scrim.rs"
required-features = ["drm"]
