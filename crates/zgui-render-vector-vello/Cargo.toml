[package]
name = "zgui-render-vector-vello"
version.workspace = true
edition.workspace = true
license.workspace = true

# L2 — backends. Every dependency is inherited: `foo.workspace = true`.
[dependencies]
kurbo.workspace = true
peniko.workspace = true
tracing.workspace = true
vello.workspace = true
wgpu.workspace = true
zgui-color = { path = "../zgui-color", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-profile = { path = "../zgui-profile", version = "0.1.0" }
zgui-render = { path = "../zgui-render", version = "0.1.0" }
zgui-render-vector-coverage = { path = "../zgui-render-vector-coverage", version = "0.1.0" }
zgui-render-wgpu = { path = "../zgui-render-wgpu", version = "0.1.0" }
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }

[dev-dependencies]
zgui-atlas = { path = "../zgui-atlas", version = "0.1.0" }
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }

# Text that leaves the atlas is drawn as curves by this crate's rasteriser, and the only way to
# assert that is to drive the real stages that produce those curves: a real face shaped by the real
# engine, promoted by the real paint stage, rasterised here, and read back as pixels.
zgui-css = { path = "../zgui-css", version = "0.1.0" }
zgui-layout = { path = "../zgui-layout", version = "0.1.0" }
zgui-paint = { path = "../zgui-paint", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
zgui-text-parley = { path = "../zgui-text-parley", version = "0.1.0" }
zgui-text-style = { path = "../zgui-text-style", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-arena = { path = "../zgui-arena", version = "0.1.0" }
zgui-color = { path = "../zgui-color", version = "0.1.0" }

# A vector document is read off an element of a real document and drawn by the real emitter, for
# the same reason: a document whose colours resolved wrongly emits exactly as many primitives as
# one whose colours resolved rightly, so only the pixels tell them apart.
zgui-dom = { path = "../zgui-dom", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

[lints]
workspace = true
