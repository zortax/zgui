[package]
name = "zgui-render"
version.workspace = true
edition.workspace = true
license.workspace = true

# L1 — contracts. Every dependency is inherited: `foo.workspace = true`.
[dependencies]
thiserror.workspace = true
# The sink a renderer uploads cached rasters through, which is the one thing the atlas cannot own.
zgui-atlas = { path = "../zgui-atlas", version = "0.1.0" }
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }

[dev-dependencies]
zgui-color = { path = "../zgui-color", version = "0.1.0" }

[lints]
workspace = true
