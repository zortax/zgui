[package]
name = "zgui-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# L8 — product. Every dependency is inherited: `foo.workspace = true`.
#
# One dependency for the framework, deliberately. These are ordinary applications, and an
# application depends on the umbrella crate and nothing else: if a view, a component, a style sheet
# or an entry point needed anything further, the examples here would not compile, which is the
# point of keeping them in a package of their own rather than beside the crate they exercise.
#
# The inspector is the exception, and it is a tool rather than part of the framework: an
# application that wants one mounts it as a component and therefore names the crate that defines
# it, exactly as it would name any other component library. Nothing in `zgui` re-exports it,
# because an application that does not want a developer tool linked in should not have one.
[dependencies]
zgui = { path = "../zgui", version = "0.1.0" }
zgui-devtools = { path = "../zgui-devtools", version = "0.1.0" }
# Temporary, for diagnosing the console backend. The rule above holds for every other example: an
# application names the umbrella crate and nothing else. `tty` is the exception because the console
# it runs on has standard error pointed at the screen, so a log has to reach a file before anything
# can be read at all. Both of these go once the console path is settled.
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# What the console example needs. An application that runs on a bare Linux console asks the
# framework for that backend, and this is the same request passed through: an example is an
# application, and an application turns the feature on itself.
drm = ["zgui/drm"]

[[example]]
name = "counter"
path = "../../examples/counter.rs"

[[example]]
name = "todo"
path = "../../examples/todo.rs"

[[example]]
name = "styled"
path = "../../examples/styled.rs"

[[example]]
name = "tally"
path = "../../examples/tally.rs"

[[example]]
name = "resize"
path = "../../examples/resize.rs"

[[example]]
name = "vector"
path = "../../examples/vector.rs"

[[example]]
name = "canvas"
path = "../../examples/canvas.rs"

[[example]]
name = "surface"
path = "../../examples/surface.rs"

[[example]]
name = "custom"
path = "../../examples/custom.rs"

[[example]]
name = "async"
path = "../../examples/async.rs"

[[example]]
name = "windows"
path = "../../examples/windows.rs"

[[example]]
name = "csd"
path = "../../examples/csd.rs"

[[example]]
name = "images"
path = "../../examples/images.rs"

# The console example, which runs on the kernel's display interface rather than on a desktop. It
# names `run_drm`, so it does not compile without the backend that defines it. `required-features`
# leaves it out of `cargo build --examples` on a machine that never asked for the feature.
[[example]]
name = "tty"
path = "../../examples/tty.rs"
required-features = ["drm"]

[lints]
workspace = true
