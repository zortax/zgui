[package]
name = "zgui-text-parley"
version.workspace = true
edition.workspace = true
license.workspace = true

# L4 — engines. This is the one crate in the workspace that names a font engine, which is why
# every other crate can be built, tested and reasoned about without one.
[dependencies]
zgui-atlas = { path = "../zgui-atlas", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-profile = { path = "../zgui-profile", version = "0.1.0" }
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
zgui-text-style = { path = "../zgui-text-style", version = "0.1.0" }

# The text engine and the three crates underneath it that we address directly: the font
# collection, the face reader the cascade's metrics come from, and the CPU rasteriser.
parley.workspace = true
fontique.workspace = true
skrifa.workspace = true
swash.workspace = true

# The curves a glyph is made of, for the runs the atlas cannot serve. The same spelling of a Bézier
# the contract returns them in and the path rasteriser fills.
kurbo.workspace = true

rustc-hash.workspace = true
smallvec.workspace = true

[dev-dependencies]
# The counters have to hold in an optimised build as well as a debug one, and they are compiled
# out unless this feature asks for them.
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }

[lints]
workspace = true
