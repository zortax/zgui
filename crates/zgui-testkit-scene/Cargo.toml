[package]
name = "zgui-testkit-scene"
version.workspace = true
edition.workspace = true
license.workspace = true

# L7 — runtime and tooling. Every dependency is inherited: `foo.workspace = true`.
#
# The counters are a *normal* dependency with the `counters` feature on rather than a
# dev-dependency: this crate exists to read them, and a build in which they were compiled out
# would make every assertion written against it pass while measuring nothing.
[dependencies]
smallvec.workspace = true
zgui-atlas = { path = "../zgui-atlas", version = "0.1.0" }
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-color = { path = "../zgui-color", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-platform = { path = "../zgui-platform", version = "0.1.0" }
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }
zgui-render = { path = "../zgui-render", version = "0.1.0" }
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
zgui-text-style = { path = "../zgui-text-style", version = "0.1.0" }

[lints]
workspace = true
