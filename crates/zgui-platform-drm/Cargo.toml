[package]
name = "zgui-platform-drm"
version.workspace = true
edition.workspace = true
license.workspace = true

# L2 — backends. Every dependency is inherited: `foo.workspace = true`.
#
# The platform contract over the kernel's display interface: a program that runs on a Linux console
# with no display server under it. It drives `zgui-drm` for the display and `zgui-evdev` for input,
# and reaches libseat, libinput and libxkbcommon through the three crates that open them.
#
# Everything is gated on Linux. The kernel interface exists nowhere else, so a macOS build of the
# workspace compiles this crate as an empty one rather than failing on a header it cannot have.
[target.'cfg(target_os = "linux")'.dependencies]
# `TreeUpdate`, which the platform contract's `push_a11y_update` takes. This backend implements
# that method as a no-op: no assistive technology is connected to a console, so the closure is
# never run and no tree is built. The name is here for the signature.
accesskit.workspace = true
# A surface reports the native handles a KMS display has: the device descriptor and the primary
# plane. This is the same name the platform contract itself carries. The two `borrow_raw` calls in
# `surface.rs` that build the handles are one of the two reasons outside its tests that this crate
# is on the unsafe ledger's allowlist; `import/`, which calls a Vulkan driver, is the other. The
# tests hold a third: an `ioctl` declared and called in `input/seat.rs`.
raw-window-handle.workspace = true
# The eventfd the wake channel is, the `poll` the frame loop parks in beside the device, and the
# monotonic clock an input report is stamped against. Every one of them goes through a safe API.
# The tests add `fstat`, to read back what an exported dma-buf descriptor is, and
# `rustix::ioctl::opcode`, which builds the `EVIOCREVOKE` request number a revoked device is
# asserted against. This crate issues no ioctl of its own outside those tests.
rustix.workspace = true
tracing.workspace = true
zgui-drm = { path = "../zgui-drm", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-platform = { path = "../zgui-platform", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The stand-in display a context test hands out. This backend's own surface holds a device open,
# and a machine with no `/dev/dri` has none to open, so a test whose subject is the context takes
# the headless backend's surface instead. `zgui-platform-winit` names the same crate for the same
# reason.
zgui-platform-headless = { path = "../zgui-platform-headless", version = "0.1.0" }

[lints]
workspace = true
