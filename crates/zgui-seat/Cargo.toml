[package]
name = "zgui-seat"
version.workspace = true
edition.workspace = true
license.workspace = true

# L2 — backends. Every dependency is inherited: `foo.workspace = true`.
#
# The session, and nothing about this framework. It names no zgui crate, so it is a library that
# happens to live here rather than a layer of the product. It is written to be named by
# `zgui-platform-drm`, one step along the same layer, and by nothing else.
#
# The crate compiles on any host. libseat is opened at run time, so nothing here reaches an
# operating system at build time. `Seat` hands out a descriptor to wait on, which the standard
# library has on unix and nowhere else, so that one module is `cfg(unix)` and the rest is portable.
# What a run finds is a question the machine that runs it answers.
[dependencies]
libloading.workspace = true

# Proof that a seat stays on the thread that opened it: one fixture sends it to another thread, one
# shares it with another thread, and neither may compile. The type system holds the guarantee
# already; these fixtures fail if it stops holding.
[dev-dependencies]
trybuild.workspace = true

# The backend is chosen through an environment variable, and writing one while another thread reads
# the environment is a data race. A test harness runs its tests on several threads, so this target
# has its own `main` and sets the variable before it makes anything.
[[test]]
name = "noop"
path = "tests/noop.rs"
harness = false

[lints]
workspace = true
