[package]
name = "zgui-testkit-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The compositor and renderer zgui's tests draw through"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# L7 — runtime and tooling. Every dependency is inherited: `foo.workspace = true`.
#
# The one test crate that names compositor implementations: every other test takes its compositor
# and renderer from the factory here, so a second implementation reaches every test by an
# environment variable.
[dependencies]
compositor-api.workspace = true
compositor-capture.workspace = true
compositor-core.workspace = true
compositor-testing.workspace = true
compositor-text.workspace = true
compositor-types.workspace = true
compositor-vello.workspace = true
compositor-wgpu.workspace = true

[lints]
workspace = true
