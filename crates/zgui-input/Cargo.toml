[package]
name = "zgui-input"
version.workspace = true
edition.workspace = true
license.workspace = true

# L5 — systems. Every dependency is inherited: `foo.workspace = true`.
#
# This crate decides what an event means for a document and never carries it out at the view
# layer's edge: it resolves which listeners an event reaches and hands the list upwards, because a
# handler's argument is a view-layer type and a system that could name one would invert the graph.
# `zgui-view` is therefore absent here and asserted absent in CI.
[dependencies]
zgui-css = { path = "../zgui-css", version = "0.1.0" }
zgui-dom = { path = "../zgui-dom", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-layout = { path = "../zgui-layout", version = "0.1.0" }
# The window's own vocabulary: what a person did, and in which units the machine said it.
zgui-platform = { path = "../zgui-platform", version = "0.1.0" }
# Answering "what is under this point" needs the clip chains and the transforms the fragments were
# measured against, and both of those are the scene's tables — the same identifiers the hit index
# already carries, so naming them here is naming what the index answers with.
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

rustc-hash.workspace = true
smallvec.workspace = true

[dev-dependencies]
# The acceptance budgets read the frame counters, and a build without them compiled in would keep
# every budget green while measuring nothing.
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }
# A hover budget is a claim about a real document, a real cascade and a real fragment tree. The
# tests therefore build all three rather than a stand-in whose costs are made up.
zgui-arena = { path = "../zgui-arena", version = "0.1.0" }
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-style = { path = "../zgui-style", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
zgui-text-style = { path = "../zgui-text-style", version = "0.1.0" }
# The deterministic shaper, so a hover budget measured over text measures the design and not the
# fonts the machine happens to have installed.
zgui-testkit-scene = { path = "../zgui-testkit-scene", version = "0.1.0" }

[lints]
workspace = true
