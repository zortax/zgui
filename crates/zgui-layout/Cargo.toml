[package]
name = "zgui-layout"
version.workspace = true
edition.workspace = true
license.workspace = true

# L4 — engines. Every dependency is inherited: `foo.workspace = true`.
[dependencies]
zgui-arena = { path = "../zgui-arena", version = "0.1.0" }
# The damage set a frame accumulates and the invalidation lattice the fragment pass reads and
# writes. Both are this workspace's own bit-twiddling primitives, and there is one of each.
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-css = { path = "../zgui-css", version = "0.1.0" }
zgui-dom = { path = "../zgui-dom", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-profile = { path = "../zgui-profile", version = "0.1.0" }
# The clip chain and the transform a fragment carries are the scene's identifiers. A parallel id
# space here would be the same aliasing hazard one level up.
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
# The run and paragraph properties an inline formatting context is built from, and the two keys a
# shaped result is cached under. Named directly because they appear in this crate's own signatures:
# a run handed to a shaper carries one of them.
zgui-text-style = { path = "../zgui-text-style", version = "0.1.0" }

# The layout algorithms. The feature set is pinned in the workspace manifest and asserted by the
# versions ledger, because losing `content_size` silently zeroes every intrinsic size and losing
# `float_layout` silently deletes floats.
taffy.workspace = true

rustc-hash.workspace = true
rayon.workspace = true
smallvec.workspace = true
tracing.workspace = true

[dev-dependencies]
# The box-tree and resolved-layout goldens are written against the shared tree-dump seam, and the
# counter assertions need the counters compiled in — a build without them would keep every budget
# green while measuring nothing.
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }
zgui-testkit-scene = { path = "../zgui-testkit-scene", version = "0.1.0" }
# The custom-element reference is a packed property; the relayout test writes one.
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }
# The box tree is built from computed styles, so the acceptance tests run a real cascade over a
# real document rather than hand-writing the styles a cascade would have produced.
zgui-style = { path = "../zgui-style", version = "0.1.0" }

[features]
# Compiles the wall-clock budget target. Off by default so that an ordinary unoptimised test run
# cannot execute a budget and report an unoptimised number as a regression; the gate switches it on
# and runs that target in release.
wall-clock = []

# The wall-clock budgets, which are a different thing from the counter budgets the rest of the
# suite asserts: a time is a measurement only in an optimised build, so this target is compiled
# only when the gate asks for it, and the gate runs it in release.
[[test]]
name = "wall_clock"
required-features = ["wall-clock"]

[lints]
workspace = true
