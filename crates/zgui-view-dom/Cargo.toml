[package]
name = "zgui-view-dom"
version.workspace = true
edition.workspace = true
license.workspace = true

# L6 — frontend. Every dependency is inherited: `foo.workspace = true`.
#
# This is the crate that joins the two halves: the view layer's node-tree seam on one side, the
# document on the other. It names no style engine, no layout engine and no renderer, because every
# change it makes goes through the document's own batch API and that API owns what a change owes.
[dependencies]
zgui-dom = { path = "../zgui-dom", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-view = { path = "../zgui-view", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

rustc-hash.workspace = true
# One line when an inline declaration is dropped, which is the only report a caller gets that a
# property does not exist in this build.
tracing.workspace = true

[dev-dependencies]
zgui-elements = { path = "../zgui-elements", version = "0.1.0" }
# The stub backend, so this crate's own tests can build the same view against the other
# implementation of the seam and compare what the two do.
zgui-view = { path = "../zgui-view", version = "0.1.0", features = ["stub-backend"] }
zgui-reactive = { path = "../zgui-reactive", version = "0.1.0" }
# The acceptance tests style a real document, so they need the rule set and the framework's own
# style sheet — the one place the vocabulary's layout defaults are written down.
zgui-css = { path = "../zgui-css", version = "0.1.0" }
zgui-style = { path = "../zgui-style", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
# `<vector>` is the one element whose acceptance runs the whole way through: a view sets its paths
# and its paint, the cascade resolves them, and the paint stage turns them into scene items.
zgui-color = { path = "../zgui-color", version = "0.1.0" }
zgui-paint = { path = "../zgui-paint", version = "0.1.0" }
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }
# The display list a renderer is actually handed, so `<vector>`'s acceptance ends at a renderer
# rather than at a scene a test built and then read back to itself.
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-render = { path = "../zgui-render", version = "0.1.0" }
zgui-testkit-scene = { path = "../zgui-testkit-scene", version = "0.1.0" }

[lints]
workspace = true
