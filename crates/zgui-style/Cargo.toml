[package]
name = "zgui-style"
version.workspace = true
edition.workspace = true
license.workspace = true

# L4 — engines. Every dependency is inherited: `foo.workspace = true`.
[dependencies]
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-css = { path = "../zgui-css", version = "0.1.0" }
zgui-dom = { path = "../zgui-dom", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-profile = { path = "../zgui-profile", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
# The shaping-key / breaking-key split is what says whether a style change costs a re-shape or
# only a re-break, and damage translation is its consumer.
zgui-text-style = { path = "../zgui-text-style", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

# The style engine itself. This crate drives it; nothing above it names any of these.
stylo.workspace = true
stylo_dom.workspace = true
selectors.workspace = true
servo_arc.workspace = true
cssparser.workspace = true

# The engine's own length unit and the geometry its device is built from, both of which appear in
# the signatures this crate has to write.
app_units.workspace = true
euclid.workspace = true

bitflags.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
tracing.workspace = true

[dev-dependencies]
# The counters are compiled out of an optimised build unless this feature asks for them, and the
# budgets have to be readable from `cargo test --release` as well as from a debug build.
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }

[lints]
workspace = true
