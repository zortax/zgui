[package]
name = "zgui-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

# L7 — runtime and tooling. Every dependency is inherited: `foo.workspace = true`.
#
# The crate that assembles everything else into one program: the frame pipeline, the dirty
# scheduler, the reactive flush, the timer heap, the observation registry, the listener dispatch
# table, and the window and surface lifecycle. It names no windowing library and no graphics API —
# the first arrives as the platform contract and the second as the renderer contract — which is
# what lets the whole loop be exercised with no display server at all.
[dependencies]
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The accessibility projection. A frame publishes the tree and routes the actions that come back,
# and both are frame-loop concerns: only the loop knows when the document and its geometry agree,
# and an action has to be dispatched where listeners can be called.
zgui-a11y = { path = "../zgui-a11y", version = "0.1.0" }
zgui-atlas = { path = "../zgui-atlas", version = "0.1.0" }
zgui-anim = { path = "../zgui-anim", version = "0.1.0" }
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-color = { path = "../zgui-color", version = "0.1.0" }
# Read for one value only: the element's own `color`, which is what a caret is drawn in so that it
# contrasts with whatever background the field has whichever theme is in force.
zgui-css = { path = "../zgui-css", version = "0.1.0" }
zgui-dom = { path = "../zgui-dom", version = "0.1.0" }
zgui-edit = { path = "../zgui-edit", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-input = { path = "../zgui-input", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-layout = { path = "../zgui-layout", version = "0.1.0" }
zgui-paint = { path = "../zgui-paint", version = "0.1.0" }
zgui-platform = { path = "../zgui-platform", version = "0.1.0" }
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }
zgui-reactive = { path = "../zgui-reactive", version = "0.1.0" }
zgui-render = { path = "../zgui-render", version = "0.1.0" }
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }
# The frame owns scroll offsets and this is where they live: writing one is a fast path over the
# fragments a frame already has, and the loop is what drives it.
zgui-scroll = { path = "../zgui-scroll", version = "0.1.0" }
zgui-style = { path = "../zgui-style", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
zgui-text-style = { path = "../zgui-text-style", version = "0.1.0" }
zgui-view = { path = "../zgui-view", version = "0.1.0" }
zgui-view-dom = { path = "../zgui-view-dom", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

[dev-dependencies]
# The consumer half of the accessibility bus, in tests only. What a window publishes is a sequence
# of differences, and whether that sequence is well formed — whether every identifier in it still
# resolves after the nodes that have left the tree have left it — is a question only the code that
# applies them can answer. A hand-written stand-in for it would be a check written to agree with
# the thing it is checking.
accesskit_consumer.workspace = true
# The key arena, for the one test that has to name a replaced node without a document to take the
# name from: nothing in the runtime attaches a picture to one, so the fixture builds the identity
# by hand.
zgui-arena = { path = "../zgui-arena", version = "0.1.0" }
zgui-elements = { path = "../zgui-elements", version = "0.1.0" }
zgui-platform-headless = { path = "../zgui-platform-headless", version = "0.1.0" }
# A renderer that records instead of drawing, so the whole loop runs with no graphics device.
zgui-testkit-scene = { path = "../zgui-testkit-scene", version = "0.1.0" }

[lints]
workspace = true
