[package]
name = "zgui-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Frame stages and work counters for zgui"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# L0 — foundation. Every dependency is inherited: `foo.workspace = true`.
[dependencies]
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[features]
# Keeps the frame counters live in a build that would otherwise drop them. They are compiled in
# whenever debug assertions are on, so this is what a release-mode test harness switches on to be
# able to read them.
counters = []
# Keeps a per-thread allocation tag that the frame's stage marks and a few hot sites set, for a
# tagging allocator to read. Without it every tag call compiles to nothing.
alloc-tags = []

[lints]
workspace = true
