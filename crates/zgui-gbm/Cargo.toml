[package]
name = "zgui-gbm"
version.workspace = true
edition.workspace = true
license.workspace = true

# L2 — backends. Every dependency is inherited: `foo.workspace = true`.
#
# libgbm, and nothing about this framework. It names no zgui crate, so it is a library that happens
# to live here rather than a layer of the product: what depends on it is `zgui-platform-drm` and
# `zgui-scanout`, one step along the same layer.
#
# libgbm is opened at run time, so no build here reaches a library or a header. The code still
# names file descriptors, which `std::os::fd` only has on a Unix host, so the crate is empty
# anywhere else and its one dependency is not fetched there either.
[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true

[lints]
workspace = true
