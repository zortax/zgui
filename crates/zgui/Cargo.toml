[package]
name = "zgui"
version.workspace = true
edition.workspace = true
license.workspace = true

# L7 — runtime and tooling. Every dependency is inherited: `foo.workspace = true`.
#
# The crate an application depends on, and the only one it has to name. Everything here is a
# re-export or the wiring that turns the framework's seams into a running desktop program: the
# window backend, the graphics device, the font engine and the rasteriser, each of which is a
# decision the layers below deliberately leave open and an application should not have to make
# before its first line of interface.
[dependencies]
# The tile store, the display list and the damage set: an application that draws through a device
# this framework has no backend for implements the renderer contract, and cannot do that without
# naming what its methods take.
zgui-atlas = { path = "../zgui-atlas", version = "0.1.0" }
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-canvas = { path = "../zgui-canvas", version = "0.1.0" }
zgui-custom = { path = "../zgui-custom", version = "0.1.0" }
zgui-elements = { path = "../zgui-elements", version = "0.1.0" }
zgui-wgpu = { path = "../zgui-wgpu", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
# The text engine is a shaper wrapped in the measurer layout asks its questions through, and that
# wrapper lives with the layout algorithms that call it.
zgui-layout = { path = "../zgui-layout", version = "0.1.0" }
zgui-platform = { path = "../zgui-platform", version = "0.1.0" }
zgui-platform-winit = { path = "../zgui-platform-winit", version = "0.1.0" }
zgui-reactive = { path = "../zgui-reactive", version = "0.1.0" }
zgui-render = { path = "../zgui-render", version = "0.1.0" }
zgui-render-wgpu = { path = "../zgui-render-wgpu", version = "0.1.0" }
# What rasterises the vector parts of a display list. A renderer with none attached plans a
# drawing's passes and then composites an unwritten scratch, which is an icon that is not there —
# so this is wiring rather than a choice an application should be asked to make.
zgui-render-vector-vello = { path = "../zgui-render-vector-vello", version = "0.1.0" }
zgui-runtime = { path = "../zgui-runtime", version = "0.1.0" }
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }
# The tokio backend for background work, off unless an application asks for it. Optional rather
# than a dependency of `zgui-reactive` because a multi-threaded runtime is a cost every program
# would otherwise carry to make one function work in the few that need it.
zgui-tokio = { path = "../zgui-tokio", version = "0.1.0", optional = true }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
zgui-text-parley = { path = "../zgui-text-parley", version = "0.1.0" }
zgui-view = { path = "../zgui-view", version = "0.1.0" }
zgui-view-macro = { path = "../zgui-view-macro", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

# The console backend, off unless an application asks for it. Target-gated as well as optional: the
# kernel's display interface exists on Linux and nowhere else, so a macOS build of an application
# that names the feature still resolves rather than failing on a dependency it cannot have.
[target.'cfg(target_os = "linux")'.dependencies]
zgui-platform-drm = { path = "../zgui-platform-drm", version = "0.1.0", optional = true }
# What the console renderer says when a frame did not reach a display — a readback that answered
# nothing, a buffer the display would not give up, a driver that refused the flip — and what it
# says when it settles on copying every frame through the processor. Optional beside the backend,
# because `app/console.rs` is the only module here that reports anything this way.
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Driving the same application over buffers, which is how the wiring above is asserted on with no
# display server and no graphics device.
zgui-platform-headless = { path = "../zgui-platform-headless", version = "0.1.0" }
# The stage marks a profiling run reads back. The counters have to be compiled in, or every budget
# stays green while measuring nothing, so this names the feature rather than relying on whatever
# another crate happened to turn on.
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }

[features]
# Records which component each part of the document came from, so a development tool can show a
# component tree. Off by default; `zgui-devtools` asks for it, so linking the inspector turns it on
# and a program that does not link the inspector pays nothing for it.
instrument = ["zgui-view/instrument"]

# Routes background work to a tokio runtime, and polls the frame's tasks inside it so a UI task
# may await a tokio timer or a socket directly. Off by default: without it the framework still
# runs background work, on a small pool of its own with no reactor, which suits most programs.
# Turning it on links tokio.
tokio = ["dep:zgui-tokio"]

# Runs an application on a Linux console with no display server: the kernel's display interface,
# a mode on every display that is plugged in, and a page flip per frame. Off by default, because it
# links a second platform backend and every program that wants a window wants the other one.
#
# It adds `App::run_drm`, and that is the only entry point: the loop and the renderer factory it
# needs are correct together and useless apart.
drm = ["dep:zgui-platform-drm", "dep:tracing"]

# Compiles the wall-clock budget target. Off by default so that an ordinary unoptimised test run
# cannot execute a budget and report an unoptimised number as a regression; the gate switches it on
# and runs that target in release.
wall-clock = []

# The budgets for the path from an input event to a finished frame. Compiled only when the gate
# asks for it, and run by the gate in release.
[[test]]
name = "wall_clock"
required-features = ["wall-clock"]

[lints]
workspace = true
