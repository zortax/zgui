[package]
name = "zgui-edit"
version.workspace = true
edition.workspace = true
license.workspace = true

# L5 — systems. Every dependency is inherited: `foo.workspace = true`.
#
# The editing model. It names no text engine and no layout engine: what it needs of a shaping is
# the cluster geometry the text contract already declares, so an editor can be exercised — and a
# hit test round-tripped — against any shaper, including one with no font files behind it.
[dependencies]
zgui-dom = { path = "../zgui-dom", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-text = { path = "../zgui-text", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

[dev-dependencies]
# The property test's generator: an undo that restores the wrong state does so for one sequence in
# thousands, which is not a case anybody writes by hand.
proptest.workspace = true
# A shaper with fixed metrics behind the paragraph cache the real pipeline uses, so the cost
# assertions are made against the mechanism rather than against a model of it.
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }
zgui-scene = { path = "../zgui-scene", version = "0.1.0" }
zgui-testkit-scene = { path = "../zgui-testkit-scene", version = "0.1.0" }
zgui-text-style = { path = "../zgui-text-style", version = "0.1.0" }
# The real text engine, for the one question a fixed-metrics shaper cannot answer: what a line
# holding two directions looks like once it has been reordered.
zgui-text-parley = { path = "../zgui-text-parley", version = "0.1.0" }

[lints]
workspace = true
