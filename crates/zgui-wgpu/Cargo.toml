[package]
name = "zgui-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Surface elements that show textures from another wgpu renderer"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# L7 — runtime and tooling. Every dependency is inherited: `foo.workspace = true`.
#
# The wgpu companion: what an application links to fill `surface` elements with textures another
# renderer produced. It is the one crate that walks through `Renderer::as_any_mut` to the
# compositor's wgpu renderer, binds textures to the window's external texture slots there, and names
# wgpu only through iceblink-wgpu's re-export, so the single-wgpu rule holds by construction.
[dependencies]
iceblink.workspace = true
iceblink-wgpu.workspace = true
zgui-dom = { path = "../zgui-dom", version = "0.1.0" }
zgui-elements = { path = "../zgui-elements", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-layout = { path = "../zgui-layout", version = "0.1.0" }
zgui-paint = { path = "../zgui-paint", version = "0.1.0" }
zgui-reactive = { path = "../zgui-reactive", version = "0.1.0" }
zgui-runtime = { path = "../zgui-runtime", version = "0.1.0" }
zgui-view = { path = "../zgui-view", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

rustc-hash.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
zgui-platform = { path = "../zgui-platform", version = "0.1.0" }
zgui-platform-headless = { path = "../zgui-platform-headless", version = "0.1.0" }
zgui-testkit = { path = "../zgui-testkit", version = "0.1.0" }
# The compositor a window under test draws through, and a renderer that records its frames.
zgui-testkit-compositor = { path = "../zgui-testkit-compositor", version = "0.1.0" }
