[package]
name = "zgui-platform-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser platform backend for zgui"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# L2 — backends. Every dependency is inherited: `foo.workspace = true`.
#
# The browser backend: a canvas in a page, driven by the browser's own callbacks. It is the only
# crate that names the browser's interfaces.
#
# The browser's interfaces are gated on wasm32. A native build of the workspace compiles only the
# translation that needs no browser, which is the part its tests run.
[dependencies]
accesskit.workspace = true
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-platform = { path = "../zgui-platform", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
log.workspace = true
# With no subscriber installed, an event becomes a log record, and the console shows it.
tracing = { workspace = true, features = ["log"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
web-time.workspace = true

[lints]
workspace = true
