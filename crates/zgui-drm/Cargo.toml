[package]
name = "zgui-drm"
version.workspace = true
edition.workspace = true
license.workspace = true

# L2 — backends. Every dependency is inherited: `foo.workspace = true`.
#
# The kernel's display interface, and nothing about this framework. It names no zgui crate, so it
# is a library that happens to live here rather than a layer of the product: what depends on it is
# `zgui-platform-drm`, one step along the same layer.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `open` and `fcntl`, to ask the kernel what it applied to a descriptor this crate handed out or
# was handed, and the `DRM_IOCTL_SET_CLIENT_CAP` a test card asks for. `export_buffer` chooses
# `DRM_CLOEXEC` and `DRM_RDWR` and answers an `OwnedFd` that says nothing about either.
# `Device::over` takes a descriptor a caller opened and sets `O_NONBLOCK` on the open file
# description behind it. Both are read back rather than assumed.
rustix.workspace = true

# Not gated on the target: a build script is compiled for every host, so the crate has to be
# reachable everywhere the script is. Whether it is *run* is the script's own decision, taken
# against `CARGO_CFG_TARGET_OS`. Compiling bindgen costs no libclang; running it does.
[build-dependencies]
bindgen.workspace = true

[lints]
workspace = true
