[package]
name = "zgui-vocab"
version.workspace = true
edition.workspace = true
license.workspace = true

# L1 — contracts. Every dependency is inherited: `foo.workspace = true`.
#
# The list is exactly three, and its shortness is the point: the view layer and the document both
# name every type in this crate, and neither may reach the other's dependencies to do it.
# `accesskit` is pure `no_std` data with no platform coupling, so naming it costs nothing.
[dependencies]
accesskit.workspace = true
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }

[lints]
workspace = true
