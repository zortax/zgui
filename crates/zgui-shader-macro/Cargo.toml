[package]
name = "zgui-shader-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Macros to declare zgui application shaders"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# L6 — frontend. Every dependency is inherited: `foo.workspace = true`.
#
# The expansion names `zgui-shader` and nothing else, so an application that writes `shader!`
# depends on that crate rather than on this one's dependency list. What is named here is the shader
# front end, because this macro compiles an application's WGSL while the application is built. It
# validates the WGSL against `iceblink::shader`, the contract's prelude. iceblink-wgsl
# assembles the reference renderer's module for the prebuilt program only, which the spec allows a
# client to do ("Shaders", change 178).
[lib]
proc-macro = true

[dependencies]
bincode.workspace = true
naga = { workspace = true, features = ["wgsl-in", "serialize"] }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
iceblink.workspace = true
iceblink-wgsl.workspace = true

[lints]
workspace = true
