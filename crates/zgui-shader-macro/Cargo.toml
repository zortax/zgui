[package]
name = "zgui-shader-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Macros to declare zgui application shaders"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# L6 — frontend. Every dependency is inherited: `foo.workspace = true`.
#
# The expansion names `zgui-shader` and nothing else, so an application that writes `shader!`
# depends on that crate rather than on this one's dependency list. What is named here is the shader
# front end, because this macro compiles an application's WGSL while the application is built —
# assembled from the prelude and epilogues compositor-wgsl publishes, which is the unit a renderer
# assembles from the same text.
[lib]
proc-macro = true

[dependencies]
bincode.workspace = true
naga = { workspace = true, features = ["wgsl-in", "serialize"] }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
compositor-types.workspace = true
compositor-wgsl.workspace = true

[lints]
workspace = true
