[package]
name = "zgui-dom"
version.workspace = true
edition.workspace = true
license.workspace = true

# L3 — the document. Every dependency is inherited: `foo.workspace = true`.
[dependencies]
zgui-arena = { path = "../zgui-arena", version = "0.1.0" }
zgui-bits = { path = "../zgui-bits", version = "0.1.0" }
zgui-geom = { path = "../zgui-geom", version = "0.1.0" }
zgui-interned = { path = "../zgui-interned", version = "0.1.0" }
zgui-profile = { path = "../zgui-profile", version = "0.1.0" }
zgui-vocab = { path = "../zgui-vocab", version = "0.1.0" }

# The style engine's own types. They appear in the node record and in the columns because the
# engine reads and writes them directly; nothing above this crate names any of them.
selectors.workspace = true
servo_arc.workspace = true
stylo.workspace = true
stylo_atoms.workspace = true
stylo_dom.workspace = true
web_atoms.workspace = true

# `TElement::query_container_size` returns a `euclid` size of `app_units` in return position, so
# whichever crate implements the style engine's DOM traits has to name both.
app_units.workspace = true
euclid.workspace = true

bitflags.workspace = true
# One message, once, when a batch of changes panics and poisons the document. A poisoned document
# refuses every later change, and a failure that silently freezes an interface has to say so.
tracing.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true

# The acceptance tests drive the real style engine over this crate's own traits, which needs the
# feature prefs, a stylesheet parser and a worker pool. None of it is reachable from the library.
[dev-dependencies]
# The frame counters are compiled out of an optimised build unless this feature asks for them, and
# the invalidation budgets have to be readable from `cargo test --release` as well as from a debug
# build — a budget that only holds in debug is a budget nobody checks.
zgui-profile = { path = "../zgui-profile", version = "0.1.0", features = ["counters"] }

# The feature flags have one home, and it is the style facade. These tests parse sheets, so they
# run the same bootstrap the framework does rather than a second copy of the same list.
zgui-css = { path = "../zgui-css", version = "0.1.0" }

cssparser.workspace = true
rayon.workspace = true
trybuild.workspace = true

[lints]
workspace = true
