[package]
name = "zgui-ui-primitives"
version.workspace = true
edition.workspace = true
license.workspace = true

# L8 — product. Every dependency is inherited: `foo.workspace = true`.
#
# One dependency, and it is the umbrella crate an application depends on. These are the behaviours
# every styled component is built out of, and they are written against exactly the public API an
# application author has: anything they cannot express here is a hole in that API rather than a
# reason to reach past it.
[dependencies]
zgui = { path = "../zgui", version = "0.1.0" }

[dev-dependencies]
zgui-testkit-view = { path = "../zgui-testkit-view", version = "0.1.0" }

[lints]
workspace = true
