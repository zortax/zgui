name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it creates a release.
  workflow_call:
    inputs:
      full-history:
        description: Fetch every commit and tag, so the semver gate finds the previous release.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  debug:
    name: Lint and test
    runs-on: ubuntu-24.04
    env:
      # Debug information for every test binary does not fit on the runner disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone has no tags, and the semver gate then reports that it has no baseline.
          fetch-depth: ${{ inputs.full-history && '0' || '1' }}
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev
      # rustup installs the toolchain that rust-toolchain.toml pins.
      - name: Show toolchain
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
      - name: Record clean debug build time
        run: |
          start=$(date +%s)
          cargo build --workspace
          echo "clean debug build: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      # The console stack is experimental and only the `tty` example reaches it through
      # `zgui-console`. No other step turns on the feature that builds it.
      - name: Build the console example
        run: cargo build -p zgui-examples --features drm --example tty
      # The release gate compares the public API with the last tag.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # `--hosted` skips the gates that need the reference machine (listed in `xtask/src/ci.rs`).
      - name: Run cargo xtask ci
        run: cargo xtask ci --hosted
      - name: Report disk and memory
        if: always()
        run: |
          df -h /
          free -h

  release:
    name: Test (release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      # The wall-clock budgets run in `cargo xtask ci`, behind a feature this job leaves off.
      - name: Build
        run: cargo build --workspace --release
      - name: Test
        run: cargo test --workspace --release
      - name: Report disk and memory
        if: always()
        run: |
          df -h /
          free -h

  doc:
    name: Docs
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --workspace --no-deps

  miri:
    # Checks the aliasing of the arena's `unsafe` code. Too slow for `cargo xtask ci`.
    name: Miri (arena)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo miri test -p zgui-arena

  miri-dom:
    # Handles point into an arena that grows under them, and records point back to their store.
    # `tests/shared` writes through shared borrows from two threads, so miri's race detector sees
    # those paths. Tree borrows and permissive provenance are needed because string_cache rebuilds
    # a pointer from a packed integer when it drops an atom.
    name: Miri (document)
    runs-on: ubuntu-24.04
    env:
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-permissive-provenance -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test cells
        run: cargo miri test -p zgui-dom --test cells
      - name: Test aliasing
        run: cargo miri test -p zgui-dom --test aliasing
      - name: Test shared
        run: cargo miri test -p zgui-dom --test shared
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-permissive-provenance -Zmiri-disable-isolation -Zmiri-preemption-rate=0.5

  tsan:
    # Runs the threaded test targets under ThreadSanitizer with an instrumented `std`
    # (`-Zbuild-std`). `cargo xtask tsan` also runs a deliberate data race and fails when the
    # sanitizer does not report it. Suppressions: `xtask/tsan-suppressions.txt`.
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # The sanitized build has its own target directory.
          workspaces: ". -> target/tsan"
      - name: Test
        run: cargo xtask tsan

  loom:
    # The `DirtyCell` model checks only compile with the `loom` feature.
    name: Loom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p zgui-bits --features loom

  features:
    # Builds and lints the optional features that no other job turns on.
    name: Optional features
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Lint zgui-bits with loom
        run: cargo clippy -p zgui-bits --all-targets --features loom -- -D warnings
      - name: Lint zgui-profile with counters
        run: cargo clippy -p zgui-profile --all-targets --features counters -- -D warnings
      - name: Test zgui-profile with counters
        run: cargo test -p zgui-profile --release --features counters

  msrv:
    # Type-checks the published crates on the oldest stable toolchain they declare. The console
    # crates are left out: they are not published, and `zgui-xkb` needs nightly.
    name: Check stable 1.90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev
      - name: Install the toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: |
          cargo +1.90.0 check --workspace --locked \
            --exclude probe --exclude xtask --exclude zgui-bench --exclude zgui-conformance \
            --exclude zgui-examples --exclude zgui-console --exclude zgui-platform-drm \
            --exclude zgui-drm --exclude zgui-evdev --exclude zgui-libinput --exclude zgui-seat \
            --exclude zgui-xkb

  text-selection:
    name: Text selection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev fonts-dejavu-core
      - name: Show pinned toolchain
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
      - name: Test word boundaries
        run: cargo test --locked -p zgui-edit --lib
      - name: Test runtime text selection
        run: cargo test --locked -p zgui-runtime --test text_multiclick --test double_click --test caret --test editing --test pointer_capture
      - name: Test Input and Textarea
        run: cargo test --locked -p zgui-ui --test text_selection
      - name: Test desktop pointer normalization
        run: cargo test --locked -p zgui-platform-winit --lib input::pointer::tests

  cross:
    # Type-checks for Windows and macOS. It does not link or run anything. It catches Linux-only
    # imports, ungated dependencies and bounds that only one platform satisfies.
    name: Check Windows and macOS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check Windows
        run: cargo check --workspace --target x86_64-pc-windows-msvc
      - name: Check macOS
        run: cargo check --workspace --target aarch64-apple-darwin

  llvmpipe:
    # Runs the tests on a software Vulkan driver. Disabled: a debug build of the workspace fills
    # the runner disk before the tests start.
    name: Software GPU
    if: false
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries and the software rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev \
            mesa-vulkan-drivers vulkan-tools libvulkan1
      - name: Show the adapter
        run: vulkaninfo --summary || true
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
